name: Publish a verified PDFChief update

on:
  push:
    branches: ['delivery/**']

permissions:
  contents: write

concurrency:
  group: pdfchief-public-release
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.repository == 'Marcel0365/PDFChief-updates'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read the delivery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: delivery
          persist-credentials: false
      - name: Read the trusted publisher from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: channel
          fetch-depth: 0
          persist-credentials: false
      - name: Verify archive, feed, metadata, and release ordering
        id: release
        env:
          DELIVERY_BRANCH: ${{ github.ref_name }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: python3 channel/tools/validate-release.py delivery/.incoming "$DELIVERY_BRANCH" "$SPARKLE_PUBLIC_KEY" channel/appcast.xml
      - name: Upload and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Marcel0365/PDFChief-updates
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ARCHIVE_NAME: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          base_commit=$(git -C channel rev-parse HEAD)
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release-state.json" 2>/dev/null; then
            draft=$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["isDraft"]).lower())' "$RUNNER_TEMP/release-state.json")
          else
            gh release create "$RELEASE_TAG" --target "$base_commit" --draft \
              --title "PDFChief $RELEASE_VERSION" \
              --notes 'Universal macOS 26 app. Updates are verified with Sparkle Ed25519 signatures. This build is ad hoc signed and is not Apple notarized.'
            draft=true
          fi
          # A public tag must stay on the clean main history, never on a delivery.
          if test -n "$(git -C channel ls-remote --tags origin "refs/tags/$RELEASE_TAG")"; then
            git -C channel fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            git -C channel merge-base --is-ancestor "$RELEASE_TAG^{commit}" "$base_commit"
          fi
          if test "$draft" = true; then
            gh release upload "$RELEASE_TAG" \
              "delivery/.incoming/$ARCHIVE_NAME" delivery/.incoming/appcast.xml delivery/.incoming/release.json --clobber
          fi
          # Retry safely after a partially completed publication: published assets are immutable.
          mkdir "$RUNNER_TEMP/verify-assets"
          gh release download "$RELEASE_TAG" --pattern "$ARCHIVE_NAME" --pattern appcast.xml --pattern release.json --dir "$RUNNER_TEMP/verify-assets"
          cmp "delivery/.incoming/$ARCHIVE_NAME" "$RUNNER_TEMP/verify-assets/$ARCHIVE_NAME"
          cmp delivery/.incoming/appcast.xml "$RUNNER_TEMP/verify-assets/appcast.xml"
          cmp delivery/.incoming/release.json "$RUNNER_TEMP/verify-assets/release.json"
          if test "$draft" = true; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
          git -C channel fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git -C channel merge-base --is-ancestor "$RELEASE_TAG^{commit}" "$base_commit"
      - name: Publish the feed and remove the delivery branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Marcel0365/PDFChief-updates
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DELIVERY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git -C channel config user.name 'PDFChief Release'
          git -C channel config user.email 'pdfchief-release@users.noreply.github.com'
          cp delivery/.incoming/appcast.xml channel/appcast.xml
          git -C channel add -- appcast.xml
          if ! git -C channel diff --cached --quiet; then
            git -C channel commit -m "Publish PDFChief $RELEASE_TAG"
            git -C channel push origin HEAD:main
          fi
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$DELIVERY_BRANCH"
